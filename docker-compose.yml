name: rutalimpia

networks:
  rutalimpia-network:
    name: rutalimpia-network

volumes:
  mysql_data:

services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: "%"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - rutalimpia-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 30s

  eureka-server:
    build: ./eureka-server
    image: rutalimpia-eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - rutalimpia-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8761/ && exit 0 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  api-gateway:
    build: ./api-gateway
    image: rutalimpia-api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      eureka-server:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    networks:
      - rutalimpia-network

  ms-auth:
    build: ./ms-auth
    image: rutalimpia-ms-auth
    container_name: ms-auth
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/rutalimpia_auth?createDatabaseIfNotExist=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    networks:
      - rutalimpia-network

  ms-flota:
    build: ./ms-flota
    image: rutalimpia-ms-flota
    container_name: ms-flota
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/rutalimpia_flota?createDatabaseIfNotExist=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    networks:
      - rutalimpia-network

  ms-rutas:
    build: ./ms-rutas
    image: rutalimpia-ms-rutas
    container_name: ms-rutas
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/rutalimpia_rutas?createDatabaseIfNotExist=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    networks:
      - rutalimpia-network

  ms-solicitudes:
    build: ./ms-solicitudes
    image: rutalimpia-ms-solicitudes
    container_name: ms-solicitudes
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/rutalimpia_solicitudes?createDatabaseIfNotExist=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SERVICIOS_FLOTA_URL: http://ms-flota
      SERVICIOS_RUTAS_URL: http://ms-rutas
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    networks:
      - rutalimpia-network