spring.application.name=ms-auth
server.port=8081

# --- Base de datos MySQL (cada microservicio tiene la suya) ---
spring.datasource.url=jdbc:mysql://localhost:3306/rutalimpia_auth?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# --- JWT ---
jwt.secret=${JWT_SECRET:rutalimpia-clave-secreta-de-al-menos-32-caracteres-123}
jwt.expiration-ms=3600000

# --- Eureka (registro y descubrimiento de servicios) ---
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
