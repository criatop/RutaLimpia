spring.application.name=ms-solicitudes
server.port=8082

# --- Base de datos MySQL (cada microservicio tiene la suya) ---
spring.datasource.url=jdbc:mysql://localhost:3306/rutalimpia_solicitudes?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# --- Otros microservicios: se resuelven por nombre via Eureka (http://<nombre-del-servicio>) ---
servicios.flota.url=${FLOTA_URL:http://ms-flota}
servicios.rutas.url=${RUTAS_URL:http://ms-rutas}

# --- Worker de asignacion (simula AWS Lambda disparada por SQS) ---
rutalimpia.worker.enabled=true
rutalimpia.worker.delay-ms=10000

# --- Eureka (registro y descubrimiento de servicios) ---
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
