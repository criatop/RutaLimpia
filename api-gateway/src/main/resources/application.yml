server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # lb://<nombre> = el gateway resuelve la instancia consultando a Eureka
        - id: ms-auth
          uri: lb://ms-auth
          predicates:
            - Path=/auth/**,/usuarios/**

        - id: ms-solicitudes
          uri: lb://ms-solicitudes
          predicates:
            - Path=/solicitudes/**,/tipos-residuo/**

        - id: ms-flota
          uri: lb://ms-flota
          predicates:
            - Path=/camiones/**,/zonas/**

        - id: ms-rutas
          uri: lb://ms-rutas
          predicates:
            - Path=/rutas/**

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

rutalimpia:
  security:
    # Valida cada peticion contra ms-auth GET /auth/validate (excepto las publicas).
    enabled: ${SECURITY_ENABLED:true}
    public-paths: /auth/register,/auth/login,/auth/validate
